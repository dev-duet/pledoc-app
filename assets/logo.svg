<svg xmlns="http://www.w3.org/2000/svg" width="450" height="46" viewBox="0 0 450 46" fill="none">
  <style>
    /* Default rules for light mode backgrounds */
    .title-text { fill: #0F172A; }
    .sub-text { fill: #64748B; }

    /* Automated theme switching rules when GitHub switches to Dark Mode */
    @media (prefers-color-scheme: dark) {
      .title-text { fill: #FFFFFF; }
      .sub-text { fill: #94A3B8; }
    }
  </style>

  <!-- 1. The Rounded Icon Container -->
  <rect x="5" y="5" width="36" height="36" rx="12" fill="#4F46E5"/>
  
  <!-- 2. The Inner Shield Icon Layer -->
  <g transform="translate(11, 11)">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"></path>
      <path d="m9 12 2 2 4-4"></path>
    </svg>
  </g>

  <!-- 3. Main Brand Title Text -->
  <text x="56" y="24" class="title-text" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="-0.5px">Pledoc</text>

  <!-- 4. Description Subtext -->
  <text x="56" y="40" class="sub-text" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400">Citizen feedback for infrastructure gaps across BRICS</text>
</svg>
